# hello-api CI. Every change is tested; on main the image is built, scanned, pushed, signed and its SBOM attested.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# The default for every job: read-only. A job asks for more only where it needs it.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/unnamedid/cosign-spike
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...

  publish:
    needs: test
    # Pull requests (including ones from forks) never publish, sign or promote anything.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless signing: GitHub OIDC token -> short-lived Sigstore certificate
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build (local only, not pushed yet)
        run: docker build -t "$IMAGE:$GITHUB_SHA" .
      - name: Scan - stop here on any fixable HIGH or CRITICAL vulnerability
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE:$GITHUB_SHA"
      - name: SBOM (CycloneDX) of exactly this image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" "$TRIVY_IMAGE"
          image --format cyclonedx --output /out/sbom.cdx.json "$IMAGE:$GITHUB_SHA"
      - name: Log in to ghcr.io with this run's own short-lived token
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push, and record the digest the registry assigned
        id: push
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          digest="$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected digest: $digest"; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign the digest (keyless; the identity is this workflow on main)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attach the SBOM as a signed attestation
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE@$DIGEST"
